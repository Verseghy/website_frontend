# Pipelines-as-Code trigger: rebuild the frontend image on every push to master.
#
# PAC matches this repo to the `website-frontend` Repository CR in the verseghy
# namespace (website_k8s/verseghy-website/builds/pac-repository-frontend.yaml),
# reads this file from the pushed revision, and runs it as a PipelineRun there.
#
# The single task references the cluster's maintained `openshift-client` task
# (no hand-rolled taskSpec/image). Its SCRIPT creates a self-contained Shipwright
# BuildRun — the full build recipe lives inline in spec.build.spec, with
# source.git.revision pinned to the exact pushed commit — then `oc wait`s for it
# to complete and reports the verdict back onto the commit as a GitHub check.
# `oc wait --for=jsonpath={.status.completionTime}` returns as soon as the build
# finishes (success OR failure), so no polling loop is needed.
#
# The output image MUST be tagged with the pushed commit SHA ({{ revision }}):
# argocd-image-updater (ImageUpdater CR in website_k8s) only considers tags
# matching ^[0-9a-f]{40}$ when opening the deploy PR against website_k8s.
# An untagged push lands on :latest, which the updater ignores — the image
# builds fine but never deploys.
#
# Timeouts, from the inside out: the BuildRun gets 2h; the `oc wait` gets 130m
# so it outlives the BuildRun and reports the verdict instead of giving up
# first; the pipeline TASK carries an explicit 2h20m timeout because Tekton
# otherwise applies its cluster default TaskRun timeout of 60m — that default
# is what killed the 2026-08-28 run at exactly 1h despite the 2h30m pipeline
# timeout; the pipeline gets 2h30m. Every layer must exceed the one inside it:
# 2h build < 130m wait < 2h20m task < 2h30m pipeline.
#
# Resources: the buildah ClusterBuildStrategy caps its build-and-push step at
# 1 CPU / 2Gi. The webpack production build pins that single CPU and sits at
# the 2Gi ceiling (observed 2026-08-28: 1003m / 2046Mi with no log output for
# 90+ minutes — GC thrash), which is why builds outlived every timeout. The
# stepResources override below raises the limits for THIS build only
# (4 CPU / 6Gi; each node has 31.5 CPU / 62Gi allocatable, so no contention).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-frontend
  annotations:
    pipelinesascode.tekton.dev/on-event: '[push]'
    pipelinesascode.tekton.dev/on-target-branch: '[master]'
    pipelinesascode.tekton.dev/max-keep-runs: '5'
spec:
  timeouts:
    pipeline: '2h30m0s'
  taskRunTemplate:
    # Runs in verseghy; this SA can create/get BuildRuns via ClusterRole/edit.
    serviceAccountName: pipeline
  pipelineSpec:
    tasks:
      - name: trigger-shipwright-build
        # Overrides Tekton's cluster default TaskRun timeout (60m) — see header.
        timeout: '2h20m0s'
        taskRef:
          # Maintained task shipped with OpenShift Pipelines; pulled in-cluster.
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: openshift-client
            - name: namespace
              value: openshift-pipelines
        params:
          - name: SCRIPT
            value: |
              BR=$(echo '{"apiVersion":"shipwright.io/v1beta1","kind":"BuildRun","metadata":{"generateName":"frontend-pac-","labels":{"pipelinesascode.tekton.dev/sha":"{{ revision }}","app.kubernetes.io/managed-by":"pipelines-as-code"}},"spec":{"build":{"spec":{"source":{"type":"Git","git":{"url":"https://github.com/Verseghy/website_frontend","revision":"{{ revision }}"}},"strategy":{"name":"buildah","kind":"ClusterBuildStrategy","stepResources":[{"name":"build-and-push","resources":{"requests":{"cpu":"1","memory":"2Gi"},"limits":{"cpu":"4","memory":"6Gi"}}}]},"output":{"image":"ghcr.io/verseghy/website_frontend:{{ revision }}","pushSecret":"ghcr-pull-secret"},"timeout":"2h0m0s"}}}}' | oc create -o name -f -)
              echo "==> Created $BR (revision {{ revision }})"
              oc wait --for=jsonpath='{.status.completionTime}' "$BR" --timeout=130m
              succeeded=$(oc get "$BR" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}')
              echo "==> Succeeded=$succeeded"
              [ "$succeeded" = True ] || { oc get "$BR" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].message}{"\n"}'; exit 1; }
